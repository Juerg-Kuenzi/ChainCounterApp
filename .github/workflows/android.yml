name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      # Prueft auch, dass gradle-wrapper.jar ein offizielles Gradle-Release ist.
      - uses: gradle/actions/setup-gradle@v4

      - name: Tests, Lint und Debug-APK
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ChainCounter-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
